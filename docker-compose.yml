services:
  nexusgraph-enterprise:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexusgraph-enterprise:latest
    container_name: nexusgraph-enterprise
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
